<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003865"/>
      <stop offset="100%" stop-color="#005691"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Institutional Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f39c12" stroke-width="6" opacity="0.3"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Tech / Education Emblem: Diamond and Circuit Nodes -->
  <g transform="translate(256, 200) scale(0.95)">
    <path d="M0 -90 L90 0 L0 90 L-90 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
    <circle cx="0" cy="0" r="26" fill="#f39c12"/>
    <circle cx="0" cy="-55" r="10" fill="#ffffff"/>
    <circle cx="55" cy="0" r="10" fill="#ffffff"/>
    <circle cx="0" cy="55" r="10" fill="#ffffff"/>
    <circle cx="-55" cy="0" r="10" fill="#ffffff"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#ffffff" stroke-width="4"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Typography: ETS 2026 -->
  <text x="256" y="365" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4">ETS 2026</text>
  <text x="256" y="410" text-anchor="middle" fill="#f39c12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" letter-spacing="3">CONGRESO TÉCNICA SUPERIOR</text>
  <text x="256" y="440" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" letter-spacing="2">DETS • POLO SAAVEDRA</text>
</svg>
