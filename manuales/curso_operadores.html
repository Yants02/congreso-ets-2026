<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitación Práctica para Operadores y Personal de Oficina | Congreso ETS 2026</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --secondary: #0f172a;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --canvas-bg: #090e1f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        header.top-bar {
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 2px solid #0284c7;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .badge-operador {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: white;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #94a3b8;
        }

        .progress-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .progress-bar-bg {
            width: 180px;
            height: 10px;
            background: #0f172a;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-num {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            font-family: monospace;
        }

        /* LAYOUT */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 72px);
            overflow: hidden;
        }

        /* SIDEBAR DE CASOS OPERATIVOS */
        aside.cases-menu {
            width: 360px;
            background: #111c35;
            border-right: 1px solid #1e293b;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .menu-title {
            padding: 20px 22px;
            border-bottom: 1px solid #1e293b;
        }

        .menu-title h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .menu-title p {
            font-size: 12px;
            color: #94a3b8;
        }

        .case-list {
            list-style: none;
            padding: 12px;
        }

        .case-item {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .case-item:hover {
            background: #1e293b;
        }

        .case-item.active {
            background: #0284c7;
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .case-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .case-name {
            font-size: 14px;
            font-weight: 700;
        }

        .case-role {
            font-size: 11px;
            opacity: 0.85;
        }

        .case-status {
            font-size: 16px;
        }

        /* MAIN VIEWER */
        main.case-viewer {
            flex: 1;
            overflow-y: auto;
            padding: 32px 44px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            background: radial-gradient(circle at top left, #1e293b, #090e1f);
        }

        /* HERO CARD */
        .case-hero {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 26px 32px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-left: 6px solid #10b981;
        }

        .case-hero h1 {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .case-hero p.desc {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .pills-container {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .pill {
            background: #0f172a;
            color: #93c5fd;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        /* SIMULADOR CANVAS INTERACTIVO PARA OPERADORES */
        .canvas-card {
            background: var(--canvas-bg);
            border: 1px solid #1e3a8a;
            border-radius: 14px;
            padding: 22px;
        }

        .canvas-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .canvas-top h2 {
            font-size: 17px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .canvas-btns {
            display: flex;
            gap: 8px;
        }

        .btn-op {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-op:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }

        .btn-op.scan {
            background: #10b981;
        }
        .btn-op.scan:hover {
            background: #059669;
        }

        .btn-op.fraud {
            background: #ef4444;
        }
        .btn-op.fraud:hover {
            background: #dc2626;
        }

        #opCanvas {
            width: 100%;
            height: 340px;
            background: #050814;
            border-radius: 10px;
            border: 1px solid #1e293b;
            display: block;
            cursor: pointer;
        }

        .canvas-help {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
            text-align: center;
        }

        /* GUIA DE PROCEDIMIENTO OPERATIVO */
        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 28px;
        }

        .step-card h2 {
            font-size: 18px;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .protocol-box {
            background: #0f172a;
            border-left: 4px solid #0284c7;
            padding: 16px;
            border-radius: 6px;
            margin: 16px 0;
            font-size: 14px;
            line-height: 1.7;
        }

        /* CAPTURAS REALES */
        .screenshot-container {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin: 20px 0;
        }

        .screen-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .circ { width: 9px; height: 9px; border-radius: 50%; }
        .circ-r { background: #ef4444; }
        .circ-y { background: #f59e0b; }
        .circ-g { background: #10b981; }
        .screen-title { font-size: 12px; color: #64748b; font-family: monospace; margin-left: 6px; }

        .screenshot-container img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            border: 1px solid #1e293b;
        }

        .screen-caption {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            margin-top: 8px;
        }

        /* EVALUACIÓN SITUACIONAL (CASO REAL) */
        .situational-quiz {
            background: #111c35;
            border: 1px solid #1e3a8a;
            border-radius: 12px;
            padding: 24px;
        }

        .quiz-title {
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-opt {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .quiz-opt:hover {
            background: #334155;
        }

        .quiz-opt.ok {
            background: #064e3b;
            border-color: #10b981;
            color: #a7f3d0;
        }

        .quiz-opt.bad {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #fecaca;
        }

        .quiz-fb {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-top: 1px solid #334155;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="brand-container">
            <span class="badge-operador">Operadores & Mesa de Entrada</span>
            <div>
                <div class="brand-title">Curso Práctico de Operación en Puestos de Acceso y Oficina</div>
                <div class="brand-subtitle">Simulador de Acreditación, Validación y Asistencia al Público</div>
            </div>
        </div>

        <div class="progress-box">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="opProgressBar"></div>
            </div>
            <span class="progress-num" id="opProgressText">0% COMPLETADO</span>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace">
        
        <!-- SIDEBAR -->
        <aside class="cases-menu">
            <div class="menu-title">
                <h3>Casos Operativos Diarios</h3>
                <p>Situaciones reales frente al mostrador y molinete</p>
            </div>
            <ul class="case-list" id="caseList">
                <!-- Se puebla dinámicamente con JS -->
            </ul>
        </aside>

        <!-- MAIN VIEWER -->
        <main class="case-viewer" id="caseViewer">
            <!-- Renderizado dinámico -->
        </main>

    </div>

    <!-- SCRIPT DEL CURSO PRÁCTICO -->
    <script>
        const OPERATOR_CASES = [
            {
                id: "op-1",
                num: "01",
                title: "Acreditación Rápida con QR en Molinetes",
                role: "Operador de Molinete / Puerta",
                tag: "Control de Acceso PWA",
                desc: "Cómo escanear con la cámara del celular o tablet el código QR del participante, comprobar su identidad y habilitar el paso en menos de 2 segundos.",
                canvasSim: "qr_scan",
                screenshot: "capturas/14_pwa_operador_acreditacion.png",
                screenshotTitle: "PWA de Acreditación para Operadores (Punto de Control Molinete)",
                screenshotCaption: "Figura 1.1: Interfaz en teléfono o tablet con escáner de cámara, asignación de puerta y confirmación visual.",
                protocol: `
                    <strong>Protocolo de Atención en Puerta:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px;">
                        <li>Abrir la PWA en el celular desde <code>http://localhost:3000/pwa-operador</code>.</li>
                        <li>Verificar que el punto de acceso seleccionado coincida con tu puerta asignada (ej: <em>Puerta Principal Barracas</em>).</li>
                        <li>Solicitar al asistente: <em>"Por favor muestre el código QR en la pantalla de su celular o impreso"</em>.</li>
                        <li>Apuntar la cámara al código. La pantalla cambiará a <strong style="color:#10b981;">VERDE</strong> con el sonido de confirmación y el nombre del asistente.</li>
                        <li>Entregar el gafete físico y permitir el paso.</li>
                    </ol>
                `,
                quiz: {
                    situation: "El asistente acerca el código QR pero la pantalla muestra un recuadro ROJO con el mensaje: 'USUARIO NO AUTORIZADO - ESTADO: LISTA_ESPERA'. ¿Qué debes hacer?",
                    options: [
                        { text: "Hacerlo pasar de todas formas porque ya vino hasta el congreso.", ok: false },
                        { text: "Explicarle con amabilidad que su inscripción aún se encuentra en Lista de Espera por cupo completo y derivarlo a la Mesa de Rezagos para ver si se liberó una vacante.", ok: true },
                        { text: "Quitarle el teléfono y apagar la cámara.", ok: false }
                    ],
                    feedback: "Los asistentes en lista de espera no tienen ingreso permitido automático. La Mesa de Rezagos evalúa las vacantes disponibles según los ausentes del día."
                }
            },
            {
                id: "op-2",
                num: "02",
                title: "Detección de Fraude y Regla Anti-Passback",
                role: "Operador de Molinete / Seguridad",
                tag: "Prevención de Fraude",
                desc: "Qué hacer cuando un participante intenta ingresar dos veces con la misma credencial o le presta la captura de pantalla de su QR a un tercero.",
                canvasSim: "antipassback",
                screenshot: "capturas/08_admin_acreditaciones.png",
                screenshotTitle: "Auditoría de Acreditaciones y Violaciones de Passback",
                screenshotCaption: "Figura 2.1: Registro en tiempo real de accesos con horario exacto, punto de control y marca de intento duplicado.",
                protocol: `
                    <strong>Protocolo ante Alerta de Passback:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px;">
                        <li>Al escanear, la PWA emite un tono grave de alerta y muestra: <strong style="color:#ef4444;">ALERTA ANTI-PASSBACK: EL ASISTENTE YA REGISTRÓ INGRESO HACE X MINUTOS</strong>.</li>
                        <li>Detener el ingreso de la persona y solicitar su Documento Nacional de Identidad (DNI) físico.</li>
                        <li>Comprobar si el nombre en el DNI coincide con la persona que figura en la pantalla.</li>
                        <li>Si el participante había salido transitoriamente y olvidó marcar salida en el molinete de egreso, pulsar la opción supervisada <em>"Autorizar Reingreso Justificado"</em>.</li>
                        <li>Si la persona que presenta el código NO es el titular del DNI, se retiene el ingreso y se notifica al coordinador del sector.</li>
                    </ol>
                `,
                quiz: {
                    situation: "Una persona intenta ingresar exhibiendo una captura de pantalla de WhatsApp con el QR de un colega. Al escanearlo, el sistema indica que ese usuario ya está adentro. ¿Cuál es el procedimiento?",
                    options: [
                        { text: "Solicitarle su propio DNI, explicarle que las credenciales son personales e intransferibles y derivarlo a la oficina para inscribirse si hay cupo remanente.", ok: true },
                        { text: "Permitir que pase si dice ser amigo del titular.", ok: false },
                        { text: "Desinstalar la aplicación.", ok: false }
                    ],
                    feedback: "El código QR es único y personal. No está permitido el préstamo o duplicación de credenciales."
                }
            },
            {
                id: "op-3",
                num: "03",
                title: "Mesa de Entradas: Búsqueda Manual y Olvido de QR",
                role: "Operador de Oficina / Mesa de Entrada",
                tag: "Atención al Participante",
                desc: "Procedimiento para cuando un participante llega sin batería en el teléfono, no encuentra el correo de confirmación o extravió su comprobante.",
                canvasSim: "manual_search",
                screenshot: "capturas/05_admin_usuarios.png",
                screenshotTitle: "Padrón de Usuarios y Buscador Rápido por DNI",
                screenshotCaption: "Figura 3.1: Módulo de participantes con filtro instantáneo por DNI, correo o apellido.",
                protocol: `
                    <strong>Protocolo de Búsqueda Manual:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px;">
                        <li>En la computadora de la oficina, abrir la pestaña <strong>Usuarios / Participantes</strong> en el panel.</li>
                        <li>Solicitar el DNI o pasaporte físico del asistente.</li>
                        <li>Escribir el número de documento en la caja de búsqueda (ej: <code>38123456</code>).</li>
                        <li>Verificar el estado: si figura como <code>CONFIRMADO</code>, hacer clic en el botón <strong>"Acreditar Manualmente"</strong> o <strong>"Ver Gafete"</strong>.</li>
                        <li>Se puede reemitir o imprimir la credencial en el momento con la impresora térmica o láser de la mesa.</li>
                    </ol>
                `,
                quiz: {
                    situation: "Un asistente no tiene teléfono celular y dice estar inscripto. Al buscar su DNI en el padrón, el buscador no arroja ningún resultado. ¿Qué acción corresponde?",
                    options: [
                        { text: "Decirle que se retire porque no figura.", ok: false },
                        { text: "Verificar si escribió mal su DNI o buscarlo por Apellido; si verdaderamente nunca completó el formulario, verificar si el cupo general permite inscribirlo en el momento desde /participa.", ok: true },
                        { text: "Crear un usuario falso con el DNI de otra persona.", ok: false }
                    ],
                    feedback: "Siempre conviene buscar por Apellido antes de descartar, ya que a veces los participantes ingresan un dígito erróneo al anotarse."
                }
            },
            {
                id: "op-4",
                num: "04",
                title: "Reenvío de Credenciales y Correos Oficiales",
                role: "Operador de Oficina / Soporte",
                tag: "Comunicaciones",
                desc: "Cómo reenviar la confirmación y el gafete digital a asistentes que informan que el correo 'no les llegó' o cayó en la carpeta de Spam.",
                canvasSim: "mail_resend",
                screenshot: "capturas/19_admin_correo_plantilla.png",
                screenshotTitle: "Editor y Reenvío de Plantillas Institucionales",
                screenshotCaption: "Figura 4.1: Vista previa del correo institucional y verificación de envío con el código QR inline adjunto.",
                protocol: `
                    <strong>Procedimiento de Asistencia por Correo:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px;">
                        <li>Preguntar al asistente si revisó su casilla de <strong>Spam / Correo No Deseado</strong> o la pestaña <em>Promociones</em>.</li>
                        <li>Si no lo encuentra, ubicar al participante en el módulo de usuarios por su DNI.</li>
                        <li>Verificar que la dirección de correo esté bien escrita (errores típicos: <code>@gmai.com</code> en lugar de <code>@gmail.com</code>).</li>
                        <li>Si estaba mal escrita, corregirla y presionar <strong>"Reenviar Credencial"</strong>.</li>
                        <li>También se le puede indicar que ingrese desde su teléfono a <code>/mi-credencial</code> e introduzca su DNI para descargarla al instante.</li>
                    </ol>
                `,
                quiz: {
                    situation: "El asistente necesita acceder a su credencial inmediatamente porque la fila en puerta avanza rápido y su buzón de correo tarda en sincronizar. ¿Cuál es el camino más rápido?",
                    options: [
                        { text: "Hacerlo esperar 40 minutos hasta que llegue el correo.", ok: false },
                        { text: "Indicarle que ingrese en el navegador de su teléfono a la dirección http://localhost:3000/mi-credencial, escriba su DNI y verá su código QR en pantalla de inmediato.", ok: true },
                        { text: "Suspender el congreso.", ok: false }
                    ],
                    feedback: "El portal cuenta con el acceso de autoservicio /mi-credencial para que cualquier inscripto confirmado obtenga su gafete sin depender de su casilla de mail."
                }
            },
            {
                id: "op-5",
                num: "05",
                title: "Consultas de Certificados y Validación de Autenticidad",
                role: "Personal de Oficina / Mesa de Certificaciones",
                tag: "Certificados Digitales",
                desc: "Atención de asistentes que solicitan su diploma de asistencia, verificación de carga horaria cátedra y consulta de autenticidad pública con código ETS26.",
                canvasSim: "cert_verify",
                screenshot: "capturas/09_admin_certificados.png",
                screenshotTitle: "Emisión y Descarga de Certificados Oficiales",
                screenshotCaption: "Figura 5.1: Módulo de certificados con estado de emisión, horas cátedra y descarga en PDF vectorial.",
                protocol: `
                    <strong>Emisión y Validación de Diplomas:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px;">
                        <li>El asistente consulta si ya se encuentra disponible su certificado de asistencia.</li>
                        <li>En el panel, abrir la pestaña <strong>Certificados</strong> y buscar al participante.</li>
                        <li>Comprobar que cumpla con el requisito mínimo de acreditación de ingreso al evento.</li>
                        <li>Si está en condiciones, presionar <strong>"Descargar PDF"</strong> o enviárselo a su correo.</li>
                        <li>Explicar al participante que cualquier autoridad educativa puede validar su certificado escaneando el código QR impreso en el pie del diploma.</li>
                    </ol>
                `,
                quiz: {
                    situation: "Un participante que figuraba inscripto pero NUNCA se acreditó en la puerta del congreso exige que se le entregue el certificado de asistencia oficial. ¿Cuál es la respuesta reglamentaria?",
                    options: [
                        { text: "Emitir el certificado de todas formas para no discutir.", ok: false },
                        { text: "Informarle amablemente que la normativa de la DETS exige la acreditación efectiva en puerta registrada por el sistema para la emisión de certificados con horas cátedra.", ok: true },
                        { text: "Cobrarle dinero por el certificado.", ok: false }
                    ],
                    feedback: "El sistema no permite emitir certificados oficiales a participantes que no tengan al menos un registro de ingreso válido en la tabla de acreditaciones."
                }
            }
        ];

        let currentCaseIdx = 0;
        const passedCases = new Set();

        function renderCaseMenu() {
            const list = document.getElementById('caseList');
            list.innerHTML = '';

            OPERATOR_CASES.forEach((c, idx) => {
                const isPassed = passedCases.has(idx);
                const isActive = idx === currentCaseIdx;

                const li = document.createElement('li');
                li.className = `case-item ${isActive ? 'active' : ''}`;
                li.onclick = () => selectCase(idx);

                li.innerHTML = `
                    <div class="case-info">
                        <span class="case-name">${c.num}. ${c.title}</span>
                        <span class="case-role">${c.role}</span>
                    </div>
                    <span class="case-status">${isPassed ? '✅' : '⚪'}</span>
                `;

                list.appendChild(li);
            });

            const percent = Math.round((passedCases.size / OPERATOR_CASES.length) * 100);
            document.getElementById('opProgressBar').style.width = `${percent}%`;
            document.getElementById('opProgressText').innerText = `${percent}% COMPLETADO (${passedCases.size}/${OPERATOR_CASES.length})`;
        }

        function selectCase(index) {
            currentCaseIdx = index;
            const c = OPERATOR_CASES[index];
            renderCaseMenu();

            const viewer = document.getElementById('caseViewer');
            viewer.innerHTML = `
                <!-- HERO -->
                <div class="case-hero">
                    <span class="badge-operador">Caso Operativo ${c.num} de ${OPERATOR_CASES.length}</span>
                    <h1>${c.title}</h1>
                    <p class="desc">${c.desc}</p>
                    <div class="pills-container">
                        <span class="pill">💼 Puesto: ${c.role}</span>
                        <span class="pill">📌 Área: ${c.tag}</span>
                    </div>
                </div>

                <!-- SIMULADOR CANVAS INTERACTIVO -->
                <div class="canvas-card">
                    <div class="canvas-top">
                        <h2>🎮 Simulador de Terminal: ${c.title}</h2>
                        <div class="canvas-btns">
                            <button class="btn-op scan" onclick="triggerOpAction('normal')">📱 Simular Escaneo Normal</button>
                            <button class="btn-op fraud" onclick="triggerOpAction('fraud')">⚠️ Simular Caso Conflicto</button>
                        </div>
                    </div>
                    <canvas id="opCanvas" width="900" height="340"></canvas>
                    <div class="canvas-help" id="opCanvasHelp">Haz clic sobre la pantalla de simulación para interactuar con la terminal del operador.</div>
                </div>

                <!-- PROTOCOLO DE TRABAJO -->
                <div class="step-card">
                    <h2>📋 Procedimiento y Protocolo Paso a Paso</h2>
                    <div class="protocol-box">${c.protocol}</div>

                    <div class="screenshot-container">
                        <div class="screen-header">
                            <span class="circ circ-r"></span>
                            <span class="circ circ-y"></span>
                            <span class="circ circ-g"></span>
                            <span class="screen-title">${c.screenshotTitle}</span>
                        </div>
                        <img src="${c.screenshot}" alt="${c.screenshotTitle}">
                        <div class="screen-caption">${c.screenshotCaption}</div>
                    </div>
                </div>

                <!-- CASO SITUACIONAL -->
                <div class="situational-quiz">
                    <div class="quiz-title">❓ Situación Real en el Mostrador: ${c.quiz.situation}</div>
                    <div class="quiz-options">
                        ${c.quiz.options.map((opt, i) => `
                            <div class="quiz-opt" onclick="answerCaseQuiz(${i}, ${opt.ok})">
                                ${String.fromCharCode(65 + i)}) ${opt.text}
                            </div>
                        `).join('')}
                    </div>
                    <div class="quiz-fb" id="caseQuizFb"></div>
                </div>

                <!-- NAVEGACIÓN -->
                <div class="bottom-nav">
                    <button class="btn-op" onclick="prevCase()" ${index === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                        &larr; Caso Anterior
                    </button>
                    <button class="btn-op scan" onclick="nextCase()">
                        ${index === OPERATOR_CASES.length - 1 ? '🎓 Concluir Capacitación' : 'Siguiente Caso Práctico &rarr;'}
                    </button>
                </div>
            `;

            initOpCanvas(c.canvasSim);
            viewer.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // MOTOR CANVAS PARA OPERADORES
        let opCanvasAnim = null;
        let opState = {};

        function initOpCanvas(simType) {
            if (opCanvasAnim) cancelAnimationFrame(opCanvasAnim);
            const canvas = document.getElementById('opCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            opState = {
                type: simType,
                frame: 0,
                status: "ESPERANDO PRESENTACIÓN DE QR",
                statusColor: "#38bdf8",
                screenPulse: 0,
                attendeeName: "Martín Alejandro Gómez",
                attendeeDni: "38.124.982",
                attendeeRole: "Docente Titular",
                gate: "Molinete Puerta A - Principal"
            };

            function draw() {
                opState.frame++;
                ctx.fillStyle = "#050814";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Cuadro estilo Tablet o Pantalla de Terminal de Acreditación
                const termX = 220;
                const termY = 30;
                const termW = 460;
                const termH = 280;

                // Marco de la tablet
                ctx.strokeStyle = "#334155";
                ctx.lineWidth = 3;
                ctx.strokeRect(termX, termY, termW, termH);

                // Fondo de pantalla del operador
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(termX + 4, termY + 4, termW - 8, termH - 8);

                // Barra superior de la tablet
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(termX + 4, termY + 4, termW - 8, 36);

                ctx.fillStyle = "#94a3b8";
                ctx.font = "bold 11px monospace";
                ctx.textAlign = "left";
                ctx.fillText(`TERMINAL GCABA · ${opState.gate}`, termX + 16, termY + 26);

                // Estado grande central
                ctx.fillStyle = opState.statusColor;
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(opState.status, termX + termW / 2, termY + 80);

                // Tarjeta de datos del asistente
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(termX + 30, termY + 110, termW - 60, 130);
                ctx.strokeStyle = "#334155";
                ctx.lineWidth = 1;
                ctx.strokeRect(termX + 30, termY + 110, termW - 60, 130);

                ctx.textAlign = "left";
                ctx.fillStyle = "#f8fafc";
                ctx.font = "bold 15px sans-serif";
                ctx.fillText(opState.attendeeName, termX + 50, termY + 145);

                ctx.fillStyle = "#94a3b8";
                ctx.font = "13px sans-serif";
                ctx.fillText(`DNI: ${opState.attendeeDni}`, termX + 50, termY + 175);
                ctx.fillText(`Categoría: ${opState.attendeeRole}`, termX + 50, termY + 200);

                // Línea de escaneo láser si está esperando
                if (opState.status.includes("ESPERANDO")) {
                    const laserY = termY + 120 + ((opState.frame * 2) % 110);
                    ctx.strokeStyle = "#ef4444";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(termX + 32, laserY);
                    ctx.lineTo(termX + termW - 32, laserY);
                    ctx.stroke();
                }

                // Luz perimetral de confirmación
                if (opState.screenPulse > 0) {
                    ctx.strokeStyle = opState.statusColor;
                    ctx.lineWidth = 8;
                    ctx.strokeRect(termX, termY, termW, termH);
                    opState.screenPulse--;
                }

                opCanvasAnim = requestAnimationFrame(draw);
            }

            draw();
        }

        function triggerOpAction(actionType) {
            if (actionType === 'normal') {
                opState.status = "✅ INGRESO HABILITADO (MOLINETE ABIERTO)";
                opState.statusColor = "#10b981";
                opState.screenPulse = 30;
                opState.attendeeName = "Martín Alejandro Gómez";
                opState.attendeeDni = "38.124.982";
                opState.attendeeRole = "Docente Confirmado (Vacante Reservada)";
                document.getElementById('opCanvasHelp').innerText = "Simulación: Escaneo exitoso con token válido. Molinete destrabado por 5 segundos.";
            } else {
                opState.status = "🚫 ERR_PASSBACK_VIOLATION (YA INGRESÓ)";
                opState.statusColor = "#ef4444";
                opState.screenPulse = 40;
                opState.attendeeName = "Martín Alejandro Gómez [INTENTO DUPLICADO]";
                opState.attendeeRole = "Ingreso previo registrado a las 09:14 en Puerta B";
                document.getElementById('opCanvasHelp').innerText = "Simulación: Intento de doble ingreso con el mismo QR. Molinete bloqueado.";
            }
        }

        function answerCaseQuiz(index, isOk) {
            const fb = document.getElementById('caseQuizFb');
            const opts = document.querySelectorAll('.quiz-opt');

            opts.forEach((o, i) => {
                o.onclick = null;
                if (i === index) {
                    o.classList.add(isOk ? 'ok' : 'bad');
                }
            });

            fb.style.display = 'block';
            if (isOk) {
                fb.style.background = '#064e3b';
                fb.style.border = '1px solid #10b981';
                fb.style.color = '#a7f3d0';
                fb.innerHTML = `<strong>¡Procedimiento Correcto!</strong> ${OPERATOR_CASES[currentCaseIdx].quiz.feedback}`;
                passedCases.add(currentCaseIdx);
                renderCaseMenu();
            } else {
                fb.style.background = '#7f1d1d';
                fb.style.border = '1px solid #ef4444';
                fb.style.color = '#fecaca';
                fb.innerHTML = `<strong>Acción No Recomendada.</strong> ${OPERATOR_CASES[currentCaseIdx].quiz.feedback}`;
            }
        }

        function prevCase() {
            if (currentCaseIdx > 0) {
                selectCase(currentCaseIdx - 1);
            }
        }

        function nextCase() {
            if (currentCaseIdx < OPERATOR_CASES.length - 1) {
                selectCase(currentCaseIdx + 1);
            } else {
                alert("🎉 ¡Excelente trabajo! Has completado todos los casos de capacitación práctica para operadores de puerta y mesa de entrada.");
            }
        }

        window.onload = () => {
            selectCase(0);
        };
    </script>

</body>
</html>
