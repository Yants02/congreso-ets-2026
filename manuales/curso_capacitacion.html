<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus de Capacitación Interactiva | Sistema Congreso ETS 2026</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --secondary: #0f172a;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0b1329;
            --card-bg: #152243;
            --card-border: #1e3a8a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --canvas-bg: #090e1f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER & TOP BAR */
        header.top-bar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: white;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-indicator {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-bar-bg {
            width: 180px;
            height: 10px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            font-family: monospace;
        }

        /* LAYOUT PRINCIPAL */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 72px);
            overflow: hidden;
        }

        /* SIDEBAR DE MÓDULOS */
        aside.modules-menu {
            width: 340px;
            background: #0f172a;
            border-right: 1px solid #1e293b;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .menu-header {
            padding: 20px 24px;
            border-bottom: 1px solid #1e293b;
        }

        .menu-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .module-list {
            list-style: none;
            padding: 12px;
        }

        .module-item {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
        }

        .module-item:hover {
            background: #1e293b;
            color: white;
        }

        .module-item.active {
            background: #1e3a8a;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .module-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .module-title {
            font-size: 14.5px;
            font-weight: 600;
        }

        .module-tag {
            font-size: 11px;
            color: var(--text-muted);
        }

        .module-status {
            font-size: 16px;
        }

        /* MAIN CONTENT AREA */
        main.course-viewer {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            background: radial-gradient(circle at top right, #172554, #090e1f);
        }

        /* HERO CARD DEL MÓDULO */
        .module-hero {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px 36px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .module-hero h1 {
            font-size: 28px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .module-hero p.summary {
            font-size: 16px;
            color: #cbd5e1;
            max-width: 900px;
        }

        .role-pills {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .role-pill {
            background: #1e293b;
            color: #93c5fd;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        /* CANVAS SECTION - SIMULADOR INTERACTIVO */
        .canvas-section {
            background: var(--canvas-bg);
            border: 1px solid #1e3a8a;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .canvas-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .canvas-controls {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }

        .btn-action.success {
            background: #10b981;
        }
        .btn-action.success:hover {
            background: #059669;
        }

        #interactiveCanvas {
            width: 100%;
            height: 380px;
            background: #060913;
            border-radius: 12px;
            border: 1px solid #1e293b;
            display: block;
            cursor: crosshair;
        }

        .canvas-legend {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        /* GUIA PASO A PASO Y CAPTURAS */
        .walkthrough-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px;
        }

        .walkthrough-card h2 {
            font-size: 20px;
            color: #e2e8f0;
            margin-bottom: 16px;
            border-bottom: 1px solid #1e3a8a;
            padding-bottom: 10px;
        }

        .step-instruction {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        /* CAPTURA DE PANTALLA ILUSTRADA */
        .screenshot-wrapper {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .window-dots {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .window-title { margin-left: 8px; font-size: 12px; color: #64748b; font-family: monospace; }

        .screenshot-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            border: 1px solid #1e293b;
        }

        .screenshot-caption {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
        }

        /* EVALUACION / CHECKPOINT */
        .quiz-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }

        .quiz-question {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-option {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .quiz-option:hover {
            background: #334155;
        }

        .quiz-option.correct {
            background: #064e3b;
            border-color: #10b981;
            color: #a7f3d0;
        }

        .quiz-option.incorrect {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #fecaca;
        }

        .quiz-feedback {
            margin-top: 12px;
            font-size: 13.5px;
            display: none;
            padding: 10px;
            border-radius: 6px;
        }

        /* NAVEGACION DE MODULOS */
        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-top: 1px solid #1e3a8a;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="brand-container">
            <span class="brand-badge">Campus Virtual DETS</span>
            <div>
                <div class="brand-title">Programa de Capacitación Operativa e Informática</div>
                <div class="brand-subtitle">1° Congreso de Educación Técnica Superior 2026</div>
            </div>
        </div>

        <div class="progress-indicator">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <span class="progress-text" id="progressText">0% COMPLETADO</span>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace">
        
        <!-- SIDEBAR DE MÓDULOS -->
        <aside class="modules-menu">
            <div class="menu-header">
                <h3>Plan de Aprendizaje (8 Módulos)</h3>
            </div>
            <ul class="module-list" id="moduleList">
                <!-- Se poblará dinámicamente con JavaScript -->
            </ul>
        </aside>

        <!-- VIEWER -->
        <main class="course-viewer" id="courseViewer">
            <!-- Contenido dinámico renderizado por JS -->
        </main>

    </div>

    <!-- SCRIPT DEL CURSO + MOTOR CANVAS -->
    <script>
        // DEFINICIÓN DE LOS 8 MÓDULOS DE CAPACITACIÓN CON TODAS LAS FUNCIONALIDADES Y CAPTURAS
        const COURSE_MODULES = [
            {
                id: "mod-1",
                num: "01",
                title: "Portal Público y Experiencia Asistente",
                tag: "Asistentes & Ciudadanos",
                roles: ["Asistente", "Docente", "Estudiante", "Operador"],
                summary: "Flujo de navegación en el portal web institucional, verificación de cupos en tiempo real, registro de participantes y emisión inmediata del gafete digital con QR dinámico cifrado.",
                canvasType: "portal_flow",
                screenshot: "capturas/01_portal_publico.png",
                screenshotTitle: "Portal Público Institucional (Landing Page con Barra de Aforos y Ejes)",

                instructions: `
                    <strong>Procedimiento Operativo:</strong>

                        <li>El backend valida la unicidad de DNI y reserva la vacante bajo bloqueo pesimista.</li>
                        <li>El sistema remite el correo de confirmación y permite visualizar la credencial digital con el código QR criptográfico.</li>

                quiz: {
                    question: "¿Qué ocurre cuando el aforo del evento alcanza el 100% de ocupación?",
                    options: [
                        { text: "El sistema permite seguir inscribiendo sin control de cupo.", correct: false },
                        { text: "El botón de inscripción se bloquea y los nuevos inscriptos ingresan automáticamente en Lista de Espera.", correct: true },
                        { text: "El servidor apaga la base de datos de inmediato.", correct: false }
                    ],
                    explanation: "Al alcanzar el cupo máximo configurado, el motor transaccional deriva automáticamente a los solicitantes a la cola ordenada de Lista de Espera."
                }
            },
            {
                id: "mod-2",
                num: "02",
                title: "Autenticación, Seguridad y Tablero 360°",
                tag: "Gestión Administrativa",
                roles: ["Superadmin", "Administrador", "Verificador"],
                summary: "Acceso seguro con contraseña PBKDF2 y salt, visibilidad de credenciales, tablero de mandos 360° con métricas en tiempo real de asistencia y ocupación del auditorio.",
                canvasType: "auth_gauge",
                screenshot: "capturas/04_admin_dashboard.png",
                screenshotTitle: "Centro de Control Administrativo - Tablero 360°",
                screenshotCaption: "Figura 2.1: Panel central con distribución de inscriptos, tasa de acreditación y accesos rápidos.",
                instructions: `
                    <strong>Procedimiento Operativo:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">

                        <li>Cuenta con un interruptor visual (ojo) para comprobar la contraseña antes de enviar.</li>
                        <li>Al autenticarse, el servidor valida el token JWT en cookie segura HTTP-Only.</li>
                        <li>El Tablero 360° muestra la curva de ingresos acumulados y el estado de sincronización.</li>
                    </ol>
                `,
                quiz: {
                    question: "¿Cómo se protegen las contraseñas de los operadores en la base de datos?",
                    options: [
                        { text: "Se guardan en texto plano en la tabla operadores.", correct: false },
                        { text: "Se cifran con hashing seguro PBKDF2 con salt aleatorio de 16 bytes y 100.000 iteraciones.", correct: true },
                        { text: "Se utiliza cifrado invertible simétrico sin sal.", correct: false }
                    ],
                    explanation: "La arquitectura utiliza el estándar criptográfico gubernamental PBKDF2-SHA512 con salt individual por operador."
                }
            },
            {
                id: "mod-3",
                num: "03",
                title: "PWA de Acreditación y Reglas Anti-Passback",
                tag: "Puestos de Acceso & Molinetes",
                roles: ["Operador de Puerta", "Personal de Guardia", "Coordinador de Sala"],
                summary: "Operación de la aplicación web progresiva (PWA) de acreditación con escáner QR de cámara, validación criptográfica AES-256 y bloqueo activo de fraude por doble ingreso.",
                canvasType: "antipassback_sim",
                screenshot: "capturas/14_pwa_operador_acreditacion.png",
                screenshotTitle: "PWA de Acreditación Rápida para Operadores en Puerta",
                screenshotCaption: "Figura 3.1: Interfaz optimizada para móviles y tablets con cámara en vivo y tarjeta de validación de identidad.",
                instructions: `
                    <strong>Protocolo en Puestos de Molinete:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">
                        <li>El operador inicia sesión en <code>/pwa-operador</code> y selecciona su punto de acceso asignado.</li>
                        <li>Apunta la cámara del dispositivo hacia el código QR presentado por el asistente.</li>
                        <li>El sistema descifra el token en menos de 100ms y valida que la inscripción figure como <code>CONFIRMADO</code>.</li>
                        <li>Si el participante ya ingresó previamente y no registró salida, se dispara la alerta sonora y visual de <strong>ERR_PASSBACK_VIOLATION</strong>.</li>

                `,
                quiz: {
                    question: "¿Qué acción debe tomar el operador si la PWA muestra 'Alerta Anti-Passback: El asistente ya se encuentra dentro'?",
                    options: [
                        { text: "Permitir el ingreso de todas maneras.", correct: false },
                        { text: "Retener al portador del QR, verificar su DNI físico y solicitar la credencial original al supervisor.", correct: true },
                        { text: "Borrar la base de datos.", correct: false }

                    explanation: "La violación de passback indica que el código QR ya fue presentado por otra persona o se duplicó indebidamente."

            {
                id: "mod-4",
                num: "04",
                title: "Ediciones de Eventos y Gestión de Sedes Físicas",
                tag: "Logística & Multievento",
                roles: ["Superadmin", "Gestor Logístico"],

                screenshot: "capturas/21_admin_eventos_sedes.png",

                        <li>Completar el nombre del predio (ej. <em>Centro Metropolitano de Diseño</em>), dirección y URL del mapa embebido.</li>

                    question: "¿Para qué sirve el campo 'Sede Mapa URL' en la configuración del evento?",

                        { text: "Para incrustar automáticamente el mapa interactivo de navegación en el portal público de los participantes.", correct: true },
                        { text: "No tiene ningún uso operativo.", correct: false }
                    ],
                    explanation: "Permite a los asistentes consultar cómo llegar en colectivo, subte o auto directamente desde la web del evento."
                }
            },
            {
                id: "mod-5",
                num: "05",
                title: "Matriz Granular de Roles y Permisos (RBAC)",
                tag: "Ciberseguridad & Gobernanza",

                summary: "Asignación de privilegios de acceso por módulo (eventos, usuarios, actividades, acreditación, certificados, correo, CMS, sistema) utilizando almacenamiento JSONB en PostgreSQL.",
                canvasType: "rbac_matrix",
                screenshot: "capturas/17_admin_rbac_roles.png",
                screenshotTitle: "Matriz Granular de Permisos RBAC en Panel Administrativo",
                screenshotCaption: "Figura 5.1: Matriz de verificación con casillas de selección por módulo y nivel operativo.",

                quiz: {

                        { text: "Aplica el principio de mínimo privilegio, evitando que un operador en puerta modifique configuraciones críticas.", correct: true },

            {

            {

                tag: "Contenido & Credenciales",
                roles: ["Administrador de Contenidos", "Diseñador Gráfico"],
                summary: "Gestión en caliente de bloques y tarjetas en la Landing Page, más el editor WYSIWYG de identificaciones digitales móviles con capas, profundidad Z-Index y coordenadas X/Y.",
                canvasType: "cms_badge_editor",
                screenshot: "capturas/20_admin_identificacion_editor.png",
                screenshotTitle: "Diseñador WYSIWYG de Identificaciones Digitales Móviles",
                screenshotCaption: "Figura 7.1: Lienzo de diseño con arrastre de widgets (QR, Nombre, DNI, Rol) y reordenamiento de capas.",
                instructions: `
                    <strong>Manejo del Diseñador WYSIWYG:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">
                        <li>Abrir la pestaña <strong>Identificación Digital</strong>.</li>

                    </ol>
                `,
                quiz: {
                    question: "¿Cómo ven los participantes su identificación digital personalizada?",
                    options: [
                        { text: "Tienen que descargar un archivo ejecutable .exe.", correct: false },
                        { text: "Ingresan a su teléfono móvil a /mi-identificacion y el visor renderiza las capas configuradas con su QR criptográfico.", correct: true },
                        { text: "Solamente se puede ver imprimiéndola en papel soporte.", correct: false }
                    ],
                    explanation: "La vista móvil está optimizada para servir como gafete digital interactivo en la pantalla de cualquier smartphone."
                }
            },
            {
                id: "mod-8",
                num: "08",
                title: "Auditoría Forense, Journaling y Respaldo de Datos",
                tag: "Infraestructura & Contingencia",
                roles: ["Superadmin", "Auditor de Sistemas"],
                summary: "Conmutación en caliente de Journaling (DISABLED, ERRORS_ONLY, VERBOSE_ALL), análisis forense de payloads de errores, tasa de peticiones (Rate Limit) y copias de seguridad de PostgreSQL.",
                canvasType: "journaling_monitor",
                screenshot: "capturas/11_admin_auditoria_backups.png",
                screenshotTitle: "Consola de Auditoría, Logs y Copias de Seguridad",
                screenshotCaption: "Figura 8.1: Visor forense de eventos del sistema con estados HTTP, latencias en ms y generador de backups SQL.",
                instructions: `
                    <strong>Protocolo de Auditoría y Resguardo:</strong>
                    <ol style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">
                        <li>En el panel, dirigirse a <strong>⚙️ Parámetros & Auditoría</strong>.</li>
                        <li>Examinar la tabla de <code>logs_journaling</code> para diagnosticar demoras en endpoints o respuestas 4xx/5xx.</li>
                        <li>Ejecutar una copia de seguridad manual antes del inicio del congreso presionando <strong>'Generar Backup Ahora'</strong>.</li>
                        <li>En caso de requerirse, purgar los registros de telemetría de más de 7 días para optimizar espacio en disco.</li>
                    </ol>
                `,
                quiz: {
                    question: "¿Cuándo es recomendable activar el modo VERBOSE_ALL en el Journaling?",
                    options: [
                        { text: "Todo el tiempo en producción masiva con miles de asistentes.", correct: false },
                        { text: "Únicamente durante pruebas de integración controladas o diagnósticos de red específicos para no sobrecargar el disco.", correct: true },
                        { text: "Nunca debe ser utilizado.", correct: false }
                    ],
                    explanation: "El nivel VERBOSE_ALL registra cada petición entrante y saliente, por lo que debe reservarse para depuración técnica."
                }
            }
        ];

        // ESTADO GLOBAL DEL CURSO
        let currentModuleIndex = 0;
        const completedModules = new Set();

        // RENDERIZAR MENÚ LATERAL
        function renderSidebar() {
            const listEl = document.getElementById('moduleList');
            listEl.innerHTML = '';

            COURSE_MODULES.forEach((mod, idx) => {
                const isCompleted = completedModules.has(idx);
                const isActive = idx === currentModuleIndex;

                const li = document.createElement('li');
                li.className = `module-item ${isActive ? 'active' : ''}`;
                li.onclick = () => selectModule(idx);

                li.innerHTML = `
                    <div class="module-info">
                        <span class="module-title">${mod.num}. ${mod.title}</span>
                        <span class="module-tag">${mod.tag}</span>
                    </div>
                    <span class="module-status">${isCompleted ? '✅' : '⚪'}</span>
                `;

                listEl.appendChild(li);
            });

            // Actualizar barra de progreso
            const percent = Math.round((completedModules.size / COURSE_MODULES.length) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${percent}% COMPLETADO (${completedModules.size}/${COURSE_MODULES.length})`;
        }

        // SELECCIONAR Y MOSTRAR MÓDULO
        function selectModule(index) {
            currentModuleIndex = index;
            const mod = COURSE_MODULES[index];
            renderSidebar();

            const viewerEl = document.getElementById('courseViewer');
            viewerEl.innerHTML = `
                <!-- HERO -->
                <div class="module-hero">
                    <span class="brand-badge">Módulo ${mod.num} de ${COURSE_MODULES.length}</span>
                    <h1>${mod.title}</h1>
                    <p class="summary">${mod.summary}</p>
                    <div class="role-pills">
                        ${mod.roles.map(r => `<span class="role-pill">👤 ${r}</span>`).join('')}
                    </div>
                </div>

                <!-- CANVAS SIMULATOR -->
                <div class="canvas-section">
                    <div class="canvas-header">
                        <h2>🎨 Laboratorio Interactivo: ${getCanvasTitle(mod.canvasType)}</h2>
                        <div class="canvas-controls">
                            <button class="btn-action" onclick="resetCanvasSim()">🔄 Reiniciar Simulación</button>
                            <button class="btn-action success" onclick="triggerCanvasEvent()">⚡ Ejecutar Evento</button>
                        </div>
                    </div>
                    <canvas id="interactiveCanvas" width="900" height="380"></canvas>
                    <div class="canvas-legend" id="canvasLegend">Interactúa con el lienzo haciendo clic sobre los nodos del sistema.</div>
                </div>

                <!-- GUIA OPERATIVA Y CAPTURA -->
                <div class="walkthrough-card">
                    <h2>📋 Guía Operativa de la Funcionalidad</h2>
                    <div class="step-instruction">${mod.instructions}</div>

                    <div class="screenshot-wrapper">
                        <div class="window-dots">
                            <span class="dot dot-red"></span>
                            <span class="dot dot-yellow"></span>
                            <span class="dot dot-green"></span>
                            <span class="window-title">${mod.screenshotTitle}</span>
                        </div>
                        <img src="${mod.screenshot}" alt="${mod.screenshotTitle}">
                        <div class="screenshot-caption">${mod.screenshotCaption}</div>
                    </div>
                </div>

                <!-- EVALUACIÓN / QUIZ -->
                <div class="quiz-section">
                    <div class="quiz-question">🎯 Validación de Conocimiento: ${mod.quiz.question}</div>
                    <div class="quiz-options">
                        ${mod.quiz.options.map((opt, i) => `
                            <div class="quiz-option" onclick="checkAnswer(${i}, ${opt.correct})">
                                ${String.fromCharCode(65 + i)}) ${opt.text}
                            </div>
                        `).join('')}
                    </div>
                    <div class="quiz-feedback" id="quizFeedback"></div>
                </div>

                <!-- FOOTER NAVIGATION -->
                <div class="course-footer">
                    <button class="btn-action" onclick="prevModule()" ${index === 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                        &larr; Módulo Anterior
                    </button>
                    <button class="btn-action success" onclick="nextModule()">
                        ${index === COURSE_MODULES.length - 1 ? '🎉 Finalizar Curso' : 'Siguiente Módulo &rarr;'}
                    </button>
                </div>
            `;

            // Inicializar simulación Canvas para este módulo
            initCanvasSimulation(mod.canvasType);
            viewerEl.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getCanvasTitle(type) {
            switch(type) {
                case 'portal_flow': return 'Simulación de Reserva de Cupos y Aforos en Tiempo Real';
                case 'auth_gauge': return 'Monitoreo de Autenticación y Carga del Servidor';
                case 'antipassback_sim': return 'Detección Activa de Anti-Passback en Molinetes';
                case 'events_venue': return 'Mapeo Dinámico de Sedes y Aforos de Salas';
                case 'rbac_matrix': return 'Flujo de Validación de Permisos RBAC JSONB';
                case 'email_designer': return 'Compilación de Plantilla de Correo con QR Inline';
                case 'cms_badge_editor': return 'Composición en Capas Z-Index del Gafete Móvil';
                case 'journaling_monitor': return 'Captura y Análisis de Latencias en Journaling';
                default: return 'Lienzo de Simulación';
            }
        }

        // MOTOR CANVAS INTERACTIVO
        let canvasAnimationId = null;
        let canvasState = {};

        function initCanvasSimulation(type) {
            if (canvasAnimationId) cancelAnimationFrame(canvasAnimationId);
            const canvas = document.getElementById('interactiveCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            canvasState = {
                type: type,
                frame: 0,
                nodes: [],
                particles: [],
                statusText: "Sistema en estado operativo normal."
            };

            // Configurar nodos según el tipo de simulación
            if (type === 'portal_flow') {
                canvasState.nodes = [
                    { id: "user", x: 120, y: 190, label: "Participante Web", color: "#38bdf8" },
                    { id: "api", x: 450, y: 190, label: "API Backend (/registro)", color: "#10b981" },
                    { id: "db", x: 780, y: 190, label: "PostgreSQL (Lock Cupo)", color: "#f59e0b" }
                ];
            } else if (type === 'antipassback_sim') {
                canvasState.nodes = [
                    { id: "pwa", x: 140, y: 190, label: "PWA Molinete Puerta A", color: "#38bdf8" },
                    { id: "crypto", x: 450, y: 190, label: "Descifrado AES-256", color: "#8b5cf6" },
                    { id: "check", x: 760, y: 190, label: "Validador Anti-Passback", color: "#ef4444" }
                ];
            } else if (type === 'rbac_matrix') {
                canvasState.nodes = [
                    { id: "req", x: 120, y: 190, label: "Petición HTTP Operador", color: "#94a3b8" },
                    { id: "mw", x: 450, y: 190, label: "Middleware RBAC JSONB", color: "#0284c7" },
                    { id: "res", x: 780, y: 190, label: "Acceso Concedido (200 OK)", color: "#10b981" }
                ];
            } else {
                canvasState.nodes = [
                    { id: "node1", x: 160, y: 190, label: "Entrada de Datos", color: "#38bdf8" },
                    { id: "node2", x: 450, y: 190, label: "Procesador Central", color: "#10b981" },
                    { id: "node3", x: 740, y: 190, label: "Persistencia Segura", color: "#f59e0b" }
                ];
            }

            // Escuchar clics en el canvas
            canvas.onclick = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;

                canvasState.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    radius: 6,
                    color: "#38bdf8",
                    life: 60
                });

                document.getElementById('canvasLegend').innerText = `Evento manual registrado en coordenadas (${Math.round(x)}, ${Math.round(y)}).`;
            };

            function draw() {
                canvasState.frame++;
                ctx.fillStyle = "#060913";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Dibujar cuadrícula tenue
                ctx.strokeStyle = "#101827";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }

                // Líneas conectoras entre nodos
                for (let i = 0; i < canvasState.nodes.length - 1; i++) {
                    const n1 = canvasState.nodes[i];
                    const n2 = canvasState.nodes[i+1];
                    ctx.strokeStyle = "#1e3a8a";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(n1.x, n1.y);
                    ctx.lineTo(n2.x, n2.y);
                    ctx.stroke();

                    // Impulso de datos animado
                    const offset = (canvasState.frame * 2) % 330;
                    const px = n1.x + (n2.x - n1.x) * (offset / 330);
                    const py = n1.y + (n2.y - n1.y) * (offset / 330);
                    ctx.fillStyle = "#38bdf8";
                    ctx.beginPath();
                    ctx.arc(px, py, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Dibujar nodos
                canvasState.nodes.forEach((node) => {
                    // Halo brillante
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 36, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(2, 132, 199, 0.15)";
                    ctx.fill();

                    // Círculo central
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 24, 0, Math.PI * 2);
                    ctx.fillStyle = node.color;
                    ctx.fill();
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Etiqueta
                    ctx.fillStyle = "#f8fafc";
                    ctx.font = "bold 13px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(node.label, node.x, node.y + 44);
                });

                // Partículas dinámicas de clic
                for (let i = canvasState.particles.length - 1; i >= 0; i--) {
                    const p = canvasState.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (p.life <= 0) canvasState.particles.splice(i, 1);
                }

                // Estado en esquina superior
                ctx.fillStyle = "#10b981";
                ctx.font = "12px monospace";
                ctx.textAlign = "left";
                ctx.fillText(`● STATUS: ${canvasState.statusText}`, 20, 30);

                canvasAnimationId = requestAnimationFrame(draw);
            }

            draw();
        }

        function resetCanvasSim() {
            initCanvasSimulation(canvasState.type);
            document.getElementById('canvasLegend').innerText = 'Simulación restablecida a valores por defecto.';
        }

        function triggerCanvasEvent() {
            canvasState.statusText = "Transacción crítica ejecutada con éxito (Latencia: 24ms).";
            for (let i = 0; i < 20; i++) {
                canvasState.particles.push({
                    x: 450,
                    y: 190,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: 5,
                    color: "#10b981",
                    life: 50
                });
            }
            document.getElementById('canvasLegend').innerText = '⚡ Transacción procesada correctamente por el motor en segundo plano.';
        }

        // VALIDACIÓN DE QUIZ
        function checkAnswer(index, isCorrect) {
            const feedbackEl = document.getElementById('quizFeedback');
            const options = document.querySelectorAll('.quiz-option');

            options.forEach((opt, i) => {
                opt.onclick = null; // deshabilitar más clics
                if (i === index) {
                    opt.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
            });

            feedbackEl.style.display = 'block';
            if (isCorrect) {
                feedbackEl.style.background = '#064e3b';
                feedbackEl.style.border = '1px solid #10b981';
                feedbackEl.style.color = '#a7f3d0';
                feedbackEl.innerHTML = `<strong>¡Correcto!</strong> ${COURSE_MODULES[currentModuleIndex].quiz.explanation}`;
                completedModules.add(currentModuleIndex);
                renderSidebar();
            } else {
                feedbackEl.style.background = '#7f1d1d';
                feedbackEl.style.border = '1px solid #ef4444';
                feedbackEl.style.color = '#fecaca';
                feedbackEl.innerHTML = `<strong>Respuesta Incorrecta.</strong> ${COURSE_MODULES[currentModuleIndex].quiz.explanation}`;
            }
        }

        // NAVEGACIÓN ENTRE MÓDULOS
        function prevModule() {
            if (currentModuleIndex > 0) {
                selectModule(currentModuleIndex - 1);
            }
        }

        function nextModule() {
            if (currentModuleIndex < COURSE_MODULES.length - 1) {
                selectModule(currentModuleIndex + 1);
            } else {
                alert("🎉 ¡Felicitaciones! Has completado el programa integral de capacitación operativa del Sistema Congreso ETS 2026.");
            }
        }

        // INICIALIZACIÓN
        window.onload = () => {
            selectModule(0);
        };
    </script>
